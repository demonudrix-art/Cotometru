name: SB Radar Android APK
on:
  push:
    branches: [ghost-equal-alerts]
    paths:
      - 'drix-pulse/**'
      - '.github/workflows/drix-pulse-build.yml'
  pull_request:
    paths:
      - 'drix-pulse/**'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build DRIX Pulse debug APK
        working-directory: drix-pulse
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SB-Radar-Android
          path: drix-pulse/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
