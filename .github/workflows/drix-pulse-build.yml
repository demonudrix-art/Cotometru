name: SB Radar Android APK
on:
  push:
    branches: [ghost-equal-alerts]
    paths:
      - 'drix-pulse/**'
      - '.github/workflows/drix-pulse-build.yml'
  pull_request:
    paths:
      - 'drix-pulse/**'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Include supplied SB Radar icon
        run: |
          python3 -c 'import base64,json,pathlib; p=pathlib.Path("ghost-equal/sb-logo.js").read_text(); b=json.loads(p.split("SB_LOGO_BASE64=",1)[1].split(";",1)[0]); o=pathlib.Path("drix-pulse/app/src/main/res/drawable-nodpi/sb_radar_icon.webp"); o.parent.mkdir(parents=True,exist_ok=True); o.write_bytes(base64.b64decode(b)); print("icon bytes:",o.stat().st_size)'
      - name: Build DRIX Pulse debug APK
        working-directory: drix-pulse
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SB-Radar-Android
          path: drix-pulse/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
