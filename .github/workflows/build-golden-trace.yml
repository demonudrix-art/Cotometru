name: Build Golden Trace APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/golden-trace/**'
      - '.github/workflows/build-golden-trace.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          echo "SDK root: ${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android debug APK
        run: gradle -p android/golden-trace :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SB_Radar_Golden_Trace_debug_APK
          path: android/golden-trace/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
