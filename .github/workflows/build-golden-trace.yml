name: Build Golden Trace v1.0.3 Replay APK
on:
  workflow_dispatch:
  push:
    branches: [golden-trace-103-check]
    paths:
      - 'android/golden-trace/**'
      - '.github/workflows/build-golden-trace.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          echo "SDK root: ${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android debug APK
        run: gradle -p android/golden-trace :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SB_Radar_Golden_Trace_debug_APK
          path: android/golden-trace/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish replay APK on this branch
        if: github.ref == 'refs/heads/golden-trace-103-check'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/golden-trace/releases
          cp android/golden-trace/app/build/outputs/apk/debug/app-debug.apk android/golden-trace/releases/GoldenTrace_v1.0.3-replay.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/golden-trace/releases/GoldenTrace_v1.0.3-replay.apk
          git commit -m "Publish v1.0.3 replay APK [skip ci]"
          git push origin HEAD:golden-trace-103-check
