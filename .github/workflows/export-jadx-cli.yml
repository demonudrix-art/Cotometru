name: Export JADX CLI (temporary)
on:
  push:
    paths:
      - '.github/workflows/export-jadx-cli.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download official JADX release
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' -o jadx-1.5.6.zip
          unzip -t jadx-1.5.6.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: jadx-cli-1.5.6
          path: jadx-1.5.6.zip
          retention-days: 1
