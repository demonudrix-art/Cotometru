name: Build SB Radar APK
on:
  push:
    paths:
      - 'android/sb-radar/**'
      - '.github/workflows/build-sb-radar.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build APK
        run: gradle --no-daemon -p android/sb-radar :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SB-Radar-v2.3.0-APK
          path: android/sb-radar/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
