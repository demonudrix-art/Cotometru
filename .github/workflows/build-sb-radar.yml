name: Build SB Radar APK
on:
  push:
    paths:
      - 'android/sb-radar/**'
      - '.github/workflows/build-sb-radar.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sb-radar-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore SB Radar classic icon
        run: |
          mkdir -p android/sb-radar/app/src/main/res/drawable-nodpi
          base64 --decode android/sb-radar/assets/sb_radar_launcher.webp.base64 > android/sb-radar/app/src/main/res/drawable-nodpi/sb_radar_icon.webp
          echo 'c2b85e0e5227527ca4dd86eada8ce9c5ca91dc2a8eae70c18ec10f0c62cb8d51  android/sb-radar/app/src/main/res/drawable-nodpi/sb_radar_icon.webp' | sha256sum -c -
      - name: Build APK
        run: gradle --no-daemon -p android/sb-radar :app:assembleDebug
      - uses: actions/upload-artifact@v4
        id: apk_upload
        with:
          name: SB-Radar-v2.3.9-ML-Hourly-Vibration-Fix-APK
          path: android/sb-radar/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Save build artifact pointer
        shell: bash
        run: |
          mkdir -p .github/build-info
          printf '{"run_id":%s,"artifact_id":%s,"commit":"%s"}\n' "${{ github.run_id }}" "${{ steps.apk_upload.outputs.artifact-id }}" "${{ github.sha }}" > .github/build-info/sb-radar.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build-info/sb-radar.json
          git commit -m "chore(ci): record SB Radar APK artifact [skip ci]" || exit 0
          git push origin HEAD:"$GITHUB_REF_NAME"
