name: Build BEAST Android APK
on:
  push:
    branches: [beast-android-apk]
    paths:
      - 'beast-android-source.zip'
      - '.github/workflows/beast-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract BEAST sources
        run: unzip -q beast-android-source.zip -d beast-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble APK
        working-directory: beast-android
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BEAST-Android-Companion-APK
          path: beast-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
